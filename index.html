<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>廠商便當飲料記帳系統</title>
  <style>
    :root {
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --bg: #f0f9ff;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #bae6fd;
      --deposit: #0284c7;
      --deduct: #0369a1;
      --warning: #d97706;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; padding: 12px; background: var(--bg); color: var(--text); font-size: 15px; }
    .container { max-width: 800px; margin: 0 auto; }
    
    h1 { font-size: 1.25rem; margin: 0 0 12px 0; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; color: #0369a1; }
    .header-btns { display: flex; gap: 6px; }
    .btn { background: #e0f2fe; color: #0369a1; border: 1px solid var(--border); padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; font-weight: 600; }
    .btn:active { background: #bae6fd; }
    
    .config-card { background: #e0f2fe; border: 1px solid #7dd3fc; border-radius: 10px; padding: 12px; margin-bottom: 14px; display: flex; flex-direction: column; gap: 8px; }
    .config-row { display: flex; gap: 8px; }
    .config-card input { flex: 1; padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.9rem; background: #fff; }
    .config-card button { background: var(--primary); color: #fff; border: none; padding: 10px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; white-space: nowrap; }

    /* 今日訂餐統計看板 */
    .today-card { background: linear-gradient(135deg, #0369a1 0%, #0284c7 100%); color: #ffffff; border-radius: 12px; padding: 14px; margin-bottom: 14px; box-shadow: 0 2px 8px rgba(3, 105, 161, 0.2); }
    .today-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 8px; }
    .today-title { font-weight: bold; font-size: 1rem; display: flex; align-items: center; gap: 6px; }
    .today-total-badge { background: #bae6fd; color: #0369a1; font-weight: 800; padding: 3px 10px; border-radius: 20px; font-size: 0.9rem; }
    .today-list { display: flex; flex-wrap: wrap; gap: 8px; }
    .today-chip { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); border-radius: 8px; padding: 6px 10px; font-size: 0.85rem; display: flex; flex-direction: column; gap: 2px; }
    .today-chip-row { display: flex; gap: 6px; align-items: center; }
    .today-chip strong { color: #e0f2fe; }
    .today-empty { font-size: 0.85rem; color: #e0f2fe; }

    .vendor-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 14px; }
    @media (min-width: 640px) {
      .vendor-grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
    }
    .vendor-card { background: var(--card); border: 2px solid var(--border); border-radius: 10px; padding: 10px 12px; cursor: pointer; transition: 0.15s; }
    .vendor-card.active { border-color: var(--primary); background: #e0f2fe; box-shadow: 0 0 0 2px rgba(2, 132, 199, 0.2); }
    .vendor-name { font-weight: bold; font-size: 0.95rem; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #0369a1; }
    .vendor-balance { font-size: 1.15rem; font-weight: 700; }
    .bal-pos { color: #0284c7; }
    .bal-neg { color: #b91c1c; }
    .vendor-meta { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }

    .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 14px; box-shadow: 0 1px 3px rgba(2, 132, 199, 0.05); }
    .card-editing { border-color: var(--warning); background: #fffbeb; }
    
    .form-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
    @media (min-width: 500px) {
      .form-grid { grid-template-columns: repeat(2, 1fr); }
    }
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    label { font-size: 0.8rem; font-weight: 600; color: var(--muted); }
    input, select { padding: 11px; border: 1px solid var(--border); border-radius: 8px; font-size: 1rem; width: 100%; background: #fff; appearance: none; }
    input:focus, select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15); }
    
    .calc-box { background: #e0f2fe; padding: 10px; border-radius: 8px; margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
    .calc-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; align-items: center; }

    .checkbox-group { display: flex; align-items: center; gap: 8px; margin-top: 10px; padding: 8px 0; font-weight: 600; font-size: 0.95rem; cursor: pointer; color: #0369a1; }
    .checkbox-group input { width: 20px; height: 20px; cursor: pointer; accent-color: var(--primary); }

    .form-btns { display: flex; gap: 8px; margin-top: 10px; }
    .btn-submit { background: var(--primary); color: white; border: none; padding: 12px; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; width: 100%; box-shadow: 0 2px 4px rgba(2, 132, 199, 0.2); }
    .btn-submit:active { background: var(--primary-hover); }
    .btn-submit.editing { background: var(--warning); }
    .btn-cancel { background: #e2e8f0; color: #334155; border: none; padding: 12px 16px; border-radius: 8px; font-size: 0.95rem; font-weight: bold; cursor: pointer; }

    .filter-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 6px; flex-wrap: wrap; }
    .filter-bar strong { color: #0369a1; }
    .filter-controls { display: flex; gap: 6px; align-items: center; }
    .date-filter-input { padding: 5px 8px; font-size: 0.85rem; width: auto; border-radius: 6px; }
    
    .date-group-header { background: #e0f2fe; color: #0369a1; font-size: 0.8rem; font-weight: bold; padding: 6px 10px; border-radius: 6px; margin: 12px 0 8px 0; display: flex; justify-content: space-between; }
    .date-group-header:first-child { margin-top: 0; }

    .record-item { background: #f8fafc; border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .record-info { flex: 1; min-width: 0; }
    .record-header-row { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; flex-wrap: wrap; }
    .record-vendor { font-weight: bold; font-size: 0.95rem; color: #0f172a; }
    .record-qty-tag { background: #bae6fd; color: #0369a1; padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; }
    .record-desc { font-size: 0.9rem; color: #334155; margin: 4px 0; word-break: break-all; }
    .record-right { display: flex; flex-direction: column; align-items: flex-end; justify-content: space-between; height: 100%; gap: 6px; }
    
    .action-btns { display: flex; gap: 4px; }
    .status-btn { border: none; padding: 6px 12px; border-radius: 6px; font-size: 0.85rem; cursor: pointer; font-weight: bold; transition: 0.1s; z-index: 5; }
    .status-yes { background: #e0f2fe; color: #0369a1; border: 1px solid #7dd3fc; }
    .status-no { background: #f1f5f9; color: #64748b; border: 1px solid #cbd5e1; }
    .status-btn:active { transform: scale(0.95); }
    
    .edit-btn { background: #fef3c7; border: none; color: #b45309; padding: 6px 10px; border-radius: 6px; font-size: 0.8rem; cursor: pointer; font-weight: 500; }
    .del-btn { background: #fee2e2; border: none; color: #b91c1c; padding: 6px 10px; border-radius: 6px; font-size: 0.8rem; cursor: pointer; font-weight: 500; }
    
    .badge { padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; }
    .badge-deposit { background: #e0f2fe; color: #0369a1; }
    .badge-deduct { background: #fef2f2; color: #b91c1c; }
    
    .loading { text-align: center; padding: 20px; color: var(--muted); font-size: 0.9rem; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="container">
  <h1>
    <span>🍱 廠商便當飲料記帳系統</span>
    <div class="header-btns">
      <button class="btn" onclick="toggleConfig()">⚙️ 設定基地</button>
      <button class="btn" onclick="fetchRecords()">🔄 同步</button>
    </div>
  </h1>

  <div id="configCard" class="config-card hidden">
    <label>請貼上 Google Apps Script 網頁應用程式網址：</label>
    <div class="config-row">
      <input type="text" id="gasUrlInput" placeholder="https://script.google.com/...">
      <button onclick="saveConfig()">儲存</button>
    </div>
  </div>

  <div class="today-card">
    <div class="today-header">
      <div class="today-title">
        <span>📋 今日訂餐統計</span>
        <span id="todayDateLabel" style="font-size:0.8rem; font-weight:normal; color:#e0f2fe;"></span>
      </div>
      <div class="today-total-badge" id="todayTotalBadge">便當 0 個 / 飲料 0 杯</div>
    </div>
    <div id="todayVendorList" class="today-list">
      <div class="today-empty">載入中...</div>
    </div>
  </div>

  <div id="vendorGrid" class="vendor-grid"></div>

  <div class="card" id="formCard">
    <div id="formTitle" style="font-weight: bold; margin-bottom: 10px; font-size: 0.95rem; color: var(--primary);">➕ 新增訂餐／扣款紀錄</div>
    <form id="recordForm" onsubmit="submitRecord(event)">
      <input type="hidden" id="editId" value="">
      <div class="form-grid">
        <div class="form-group">
          <label>日期</label>
          <input type="date" id="dateInput" required>
        </div>
        <div class="form-group">
          <label>廠商名稱</label>
          <input type="text" id="vendorInput" list="vendorList" placeholder="例如：水電工程行" required>
          <datalist id="vendorList"></datalist>
        </div>
        <div class="form-group">
          <label>帳務類型</label>
          <select id="typeInput" onchange="toggleCalcFields()" required>
            <option value="扣款">➖ 扣款 (訂便當/飲料)</option>
            <option value="寄款">➕ 寄款 (廠商預繳)</option>
          </select>
        </div>
        <div class="form-group">
          <label id="amountLabel">總金額 ($)</label>
          <input type="number" id="amountInput" min="1" placeholder="自動計算總金額" required>
        </div>
      </div>

      <div id="calcSection" class="calc-box">
        <label style="font-weight: bold; color:#0369a1;">🍱 便當與飲料分開計算</label>
        
        <div style="font-size: 0.85rem; font-weight: 600; color: #0284c7;">1. 便當計算</div>
        <div class="calc-grid">
          <input type="number" id="bentoPriceInput" min="0" placeholder="單價" oninput="calculateTotal()">
          <input type="number" id="bentoQtyInput" min="0" placeholder="數量 (個)" oninput="calculateTotal()">
          <input type="text" id="bentoSubtotal" readonly placeholder="便當小計" style="background:#bae6fd; font-weight:bold; text-align:center; color:#0369a1;">
        </div>

        <div style="font-size: 0.85rem; font-weight: 600; color: #0284c7; margin-top: 4px;">2. 飲料計算</div>
        <div class="calc-grid">
          <input type="number" id="drinkPriceInput" min="0" placeholder="單價" oninput="calculateTotal()">
          <input type="number" id="drinkQtyInput" min="0" placeholder="數量 (杯)" oninput="calculateTotal()">
          <input type="text" id="drinkSubtotal" readonly placeholder="飲料小計" style="background:#bae6fd; font-weight:bold; text-align:center; color:#0369a1;">
        </div>
      </div>

      <div class="form-group" style="margin-top: 10px;">
        <label>分述 (品項備註)</label>
        <input type="text" id="descInput" placeholder="例如：排骨便當*3 + 紅茶*3" required>
      </div>

      <label class="checkbox-group" id="deliveredGroup">
        <input type="checkbox" id="deliveredInput">
        <span>已將便當／餐點交給廠商 (勾選代表已給，未勾選代表先登記數量)</span>
      </label>

      <div class="form-btns">
        <button type="submit" id="submitBtn" class="btn-submit">儲存並同步至雲端</button>
        <button type="button" id="cancelBtn" class="btn-cancel hidden" onclick="cancelEdit()">取消</button>
      </div>
    </form>
  </div>

  <div class="card">
    <div class="filter-bar">
      <strong id="tableTitle">每日明細</strong>
      <div class="filter-controls">
        <input type="date" id="filterDateInput" class="date-filter-input" onchange="renderList()" title="篩選特定日期">
        <button class="btn" onclick="resetFilters()">全部顯示</button>
      </div>
    </div>
    <div id="recordListBody">
      <div class="loading">載入雲端資料中...</div>
    </div>
  </div>
</div>

<script>
  let allRecords = [];
  let selectedVendor = 'ALL';
  let GAS_URL = localStorage.getItem('BENTO_GAS_URL') || '';

  function getTodayString() {
    const now = new Date();
    const y = now.getFullYear();
    const m = String(now.getMonth() + 1).padStart(2, '0');
    const d = String(now.getDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
  }

  document.getElementById('dateInput').value = getTodayString();
  document.getElementById('todayDateLabel').textContent = `(${getTodayString()})`;

  window.addEventListener('DOMContentLoaded', () => {
    if (!GAS_URL) {
      document.getElementById('configCard').classList.remove('hidden');
    } else {
      document.getElementById('gasUrlInput').value = GAS_URL;
      fetchRecords();
    }
  });

  function toggleConfig() {
    const card = document.getElementById('configCard');
    card.classList.toggle('hidden');
    if (!card.classList.contains('hidden') && GAS_URL) {
      document.getElementById('gasUrlInput').value = GAS_URL;
    }
  }

  function saveConfig() {
    const url = document.getElementById('gasUrlInput').value.trim();
    if (!url.startsWith('https://script.google.com')) {
      alert('請輸入有效的 Google Apps Script 網址！');
      return;
    }
    GAS_URL = url;
    localStorage.setItem('BENTO_GAS_URL', url);
    document.getElementById('configCard').classList.add('hidden');
    fetchRecords();
  }

  function toggleCalcFields() {
    const type = document.getElementById('typeInput').value;
    const calcSec = document.getElementById('calcSection');
    const delGroup = document.getElementById('deliveredGroup');
    if (type === '寄款') {
      calcSec.classList.add('hidden');
      delGroup.classList.add('hidden');
    } else {
      calcSec.classList.remove('hidden');
      delGroup.classList.remove('hidden');
    }
  }

  function calculateTotal() {
    const bPrice = parseFloat(document.getElementById('bentoPriceInput').value) || 0;
    const bQty = parseFloat(document.getElementById('bentoQtyInput').value) || 0;
    const dPrice = parseFloat(document.getElementById('drinkPriceInput').value) || 0;
    const dQty = parseFloat(document.getElementById('drinkQtyInput').value) || 0;

    const bTotal = bPrice * bQty;
    const dTotal = dPrice * dQty;
    const grandTotal = bTotal + dTotal;

    document.getElementById('bentoSubtotal').value = bTotal > 0 ? `$${bTotal}` : '';
    document.getElementById('drinkSubtotal').value = dTotal > 0 ? `$${dTotal}` : '';
    
    if (grandTotal > 0) {
      document.getElementById('amountInput').value = grandTotal;
    }
  }

  async function fetchRecords() {
    if (!GAS_URL) {
      document.getElementById('configCard').classList.remove('hidden');
      return;
    }
    const container = document.getElementById('recordListBody');
    container.innerHTML = '<div class="loading">同步雲端資料中...</div>';
    try {
      const res = await fetch(GAS_URL);
      const json = await res.json();
      if (json.status === 'success') {
        allRecords = json.data.sort((a, b) => b.date.localeCompare(a.date));
        renderDashboard();
      }
    } catch (err) {
      container.innerHTML = '<div class="loading" style="color:red;">讀取失敗，請檢查網址或權限設定。</div>';
    }
  }

  async function submitRecord(e) {
    e.preventDefault();
    if (!GAS_URL) {
      alert('請先設定雲端基地！');
      return;
    }
    const editId = document.getElementById('editId').value;
    const isEditing = !!editId;
    const type = document.getElementById('typeInput').value;
    
    const bQtyVal = type === '扣款' ? (parseInt(document.getElementById('bentoQtyInput').value, 10) || 0) : 0;
    const dQtyVal = type === '扣款' ? (parseInt(document.getElementById('drinkQtyInput').value, 10) || 0) : 0;
    
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = '儲存中...';

    const payload = {
      action: isEditing ? 'edit' : 'add',
      id: editId,
      date: document.getElementById('dateInput').value,
      vendor: document.getElementById('vendorInput').value.trim(),
      type: type,
      amount: document.getElementById('amountInput').value,
      description: document.getElementById('descInput').value.trim(),
      isDelivered: type === '扣款' ? document.getElementById('deliveredInput').checked : true,
      bentoQty: bQtyVal,
      drinkQty: dQtyVal
    };

    try {
      await fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
      });
      cancelEdit();
      await fetchRecords();
    } catch (err) {
      alert('儲存發生錯誤');
    } finally {
      btn.disabled = false;
      btn.textContent = isEditing ? '確認修改並同步' : '儲存並同步至雲端';
    }
  }

  async function toggleDelivered(id) {
    try {
      const res = await fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'toggle', id: id })
      });
      const json = await res.json();
      if (json.status === 'success') {
        await fetchRecords();
      } else {
        alert('狀態切換失敗');
      }
    } catch (err) {
      alert('狀態更新發生錯誤');
    }
  }

  function startEdit(id) {
    const record = allRecords.find(r => r.id === id);
    if (!record) return;

    document.getElementById('editId').value = record.id;
    document.getElementById('dateInput').value = record.date;
    document.getElementById('vendorInput').value = record.vendor;
    document.getElementById('typeInput').value = record.type;
    document.getElementById('amountInput').value = record.amount;
    document.getElementById('descInput').value = record.description;
    document.getElementById('deliveredInput').checked = record.isDelivered;
    
    document.getElementById('bentoQtyInput').value = record.bentoQty > 0 ? record.bentoQty : '';
    document.getElementById('drinkQtyInput').value = record.drinkQty > 0 ? record.drinkQty : '';
    document.getElementById('bentoPriceInput').value = '';
    document.getElementById('drinkPriceInput').value = '';
    document.getElementById('bentoSubtotal').value = '';
    document.getElementById('drinkSubtotal').value = '';

    toggleCalcFields();

    document.getElementById('formTitle').textContent = `✏️ 正在修改紀錄：${record.vendor} (${record.date})`;
    document.getElementById('formTitle').style.color = 'var(--warning)';
    document.getElementById('formCard').classList.add('card-editing');
    document.getElementById('submitBtn').textContent = '確認修改並同步';
    document.getElementById('submitBtn').classList.add('editing');
    document.getElementById('cancelBtn').classList.remove('hidden');

    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function cancelEdit() {
    document.getElementById('editId').value = '';
    document.getElementById('recordForm').reset();
    document.getElementById('dateInput').value = getTodayString();
    document.getElementById('bentoPriceInput').value = '';
    document.getElementById('bentoQtyInput').value = '';
    document.getElementById('drinkPriceInput').value = '';
    document.getElementById('drinkQtyInput').value = '';
    document.getElementById('bentoSubtotal').value = '';
    document.getElementById('drinkSubtotal').value = '';
    document.getElementById('deliveredInput').checked = false;
    toggleCalcFields();
    document.getElementById('formTitle').textContent = '➕ 新增訂餐／扣款紀錄';
    document.getElementById('formTitle').style.color = 'var(--primary)';
    document.getElementById('formCard').classList.remove('card-editing');
    document.getElementById('submitBtn').textContent = '儲存並同步至雲端';
    document.getElementById('submitBtn').classList.remove('editing');
    document.getElementById('cancelBtn').classList.add('hidden');
  }

  async function deleteRecord(id) {
    if (!confirm('確定要刪除這筆紀錄嗎？')) return;
    try {
      await fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'delete', id: id })
      });
      if (document.getElementById('editId').value === id) {
        cancelEdit();
      }
      await fetchRecords();
    } catch (err) {
      alert('刪除失敗');
    }
  }

  function renderTodaySummary() {
    const todayStr = getTodayString();
    document.getElementById('todayDateLabel').textContent = `(${todayStr})`;
    
    const todayVendorData = {};
    let totalBento = 0;
    let totalDrink = 0;

    allRecords.forEach(r => {
      if (r.date === todayStr && r.type === '扣款') {
        const b = r.bentoQty || 0;
        const d = r.drinkQty || 0;
        if (!todayVendorData[r.vendor]) {
          todayVendorData[r.vendor] = { bento: 0, drink: 0 };
        }
        todayVendorData[r.vendor].bento += b;
        todayVendorData[r.vendor].drink += d;
        totalBento += b;
        totalDrink += d;
      }
    });

    document.getElementById('todayTotalBadge').textContent = `便當 ${totalBento} 個 / 飲料 ${totalDrink} 杯`;
    const listEl = document.getElementById('todayVendorList');
    const vendors = Object.keys(todayVendorData);

    if (vendors.length === 0) {
      listEl.innerHTML = '<div class="today-empty">今日尚無廠商訂購登記（跨日已自動歸零）</div>';
      return;
    }

    listEl.innerHTML = vendors.map(v => {
      const item = todayVendorData[v];
      return `
        <div class="today-chip">
          <strong>${v}</strong>
          <div class="today-chip-row">
            <span>便當: ${item.bento}個</span> | <span>飲料: ${item.drink}杯</span>
          </div>
        </div>
      `;
    }).join('');
  }

  function renderDashboard() {
    renderTodaySummary();

    const vendorStats = {};
    allRecords.forEach(r => {
      if (!vendorStats[r.vendor]) {
        vendorStats[r.vendor] = { deposit: 0, deduct: 0, balance: 0 };
      }
      if (r.type === '寄款') {
        vendorStats[r.vendor].deposit += r.amount;
        vendorStats[r.vendor].balance += r.amount;
      } else {
        vendorStats[r.vendor].deduct += r.amount;
        vendorStats[r.vendor].balance -= r.amount;
      }
    });

    const grid = document.getElementById('vendorGrid');
    const dataList = document.getElementById('vendorList');
    grid.innerHTML = '';
    dataList.innerHTML = '';

    Object.keys(vendorStats).forEach(v => {
      const stat = vendorStats[v];
      const isPos = stat.balance >= 0;
      const card = document.createElement('div');
      card.className = `vendor-card ${selectedVendor === v ? 'active' : ''}`;
      card.onclick = () => selectVendor(v);
      card.innerHTML = `
        <div class="vendor-name">${v}</div>
        <div class="vendor-balance ${isPos ? 'bal-pos' : 'bal-neg'}">
          ${isPos ? '餘' : '欠'}$${Math.abs(stat.balance).toLocaleString()}
        </div>
        <div class="vendor-meta">寄$${stat.deposit.toLocaleString()} / 扣$${stat.deduct.toLocaleString()}</div>
      `;
      grid.appendChild(card);

      const option = document.createElement('option');
      option.value = v;
      dataList.appendChild(option);
    });

    renderList();
  }

  function selectVendor(vendor) {
    selectedVendor = vendor;
    if (vendor !== 'ALL') {
      document.getElementById('vendorInput').value = vendor;
    }
    renderDashboard();
  }

  function resetFilters() {
    selectedVendor = 'ALL';
    document.getElementById('filterDateInput').value = '';
    renderDashboard();
  }

  function renderList() {
    const container = document.getElementById('recordListBody');
    const title = document.getElementById('tableTitle');
    const filterDate = document.getElementById('filterDateInput').value;

    let filtered = allRecords;
    if (selectedVendor !== 'ALL') {
      filtered = filtered.filter(r => r.vendor === selectedVendor);
    }
    if (filterDate) {
      filtered = filtered.filter(r => r.date === filterDate);
    }

    title.textContent = selectedVendor === 'ALL' 
      ? `每日明細 (${filtered.length})` 
      : `【${selectedVendor}】明細 (${filtered.length})`;

    if (filtered.length === 0) {
      container.innerHTML = '<div class="loading">符合條件的紀錄為 0 筆</div>';
      return;
    }

    const groupedByDate = {};
    filtered.forEach(r => {
      if (!groupedByDate[r.date]) {
        groupedByDate[r.date] = [];
      }
      groupedByDate[r.date].push(r);
    });

    let html = '';
    Object.keys(groupedByDate).sort((a, b) => b.localeCompare(a)).forEach(dateKey => {
      const dayRecords = groupedByDate[dateKey];
      const dayBentoTotal = dayRecords.reduce((sum, r) => sum + (r.bentoQty || 0), 0);
      const dayDrinkTotal = dayRecords.reduce((sum, r) => sum + (r.drinkQty || 0), 0);
      
      html += `
        <div class="date-group-header">
          <span>📅 ${dateKey} ${dateKey === getTodayString() ? '(今天)' : ''}</span>
          <span>當日訂: 便當 ${dayBentoTotal} 個 / 飲料 ${dayDrinkTotal} 杯</span>
        </div>
      `;

      html += dayRecords.map(r => {
        const b = r.bentoQty || 0;
        const d = r.drinkQty || 0;
        let qtyText = '';
        if (b > 0 && d > 0) qtyText = `便當 ${b}個 / 飲料 ${d}杯`;
        else if (b > 0) qtyText = `便當 ${b}個`;
        else if (d > 0) qtyText = `飲料 ${d}杯`;

        return `
          <div class="record-item">
            <div class="record-info">
              <div class="record-header-row">
                <span class="record-vendor">${r.vendor}</span>
                <span class="badge ${r.type === '寄款' ? 'badge-deposit' : 'badge-deduct'}">${r.type}</span>
                ${r.type === '扣款' && qtyText ? `<span class="record-qty-tag">${qtyText}</span>` : ''}
                ${r.type === '扣款' ? `
                  <button class="status-btn ${r.isDelivered ? 'status-yes' : 'status-no'}" onclick="toggleDelivered('${r.id}')">
                    ${r.isDelivered ? '✓ 已給廠商' : '✗ 未給廠商'}
                  </button>
                ` : ''}
              </div>
              <div class="record-desc">${r.description}</div>
            </div>
            <div class="record-right">
              <div style="font-weight:bold; color:${r.type === '寄款' ? 'var(--deposit)' : 'var(--deduct)'}">
                ${r.type === '寄款' ? '+' : '-'}$${r.amount.toLocaleString()}
              </div>
              <div class="action-btns">
                <button class="edit-btn" onclick="startEdit('${r.id}')">修改</button>
                <button class="del-btn" onclick="deleteRecord('${r.id}')">刪除</button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    });

    container.innerHTML = html;
  }
</script>
</body>
</html>
